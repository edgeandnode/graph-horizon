type GraphNetwork @entity(immutable: false) {
  "Singleton entity, always '1'"
  id: Bytes!

  # Counts
  "Active service providers"
  countServiceProviders: Int!
  "Active data services (verifiers)"
  countDataServices: Int!
  "Active provisions"
  countProvisions: Int!
  "Active delegation pools"
  countDelegationPools: Int!
  "Active payers"
  countPayers: Int!
  "Active collectors"
  countCollectors: Int!
  "Active escrow accounts"
  countEscrowAccounts: Int!
  "Provision slash events"
  countProvisionSlashEvents: Int!
  "Delegation pool slash events"
  countDelegationPoolSlashEvents: Int!

  # Stake aggregates
  "Total tokens staked by service providers"
  tokensStaked: BigInt!
  "Total tokens provisioned to data services"
  tokensProvisioned: BigInt!
  "Total tokens delegated to service providers"
  tokensDelegated: BigInt!
  "Total tokens currently thawing from provisions"
  tokensThawingFromProvisions: BigInt!
  "Total tokens currently thawing from delegation pools"
  tokensThawingFromDelegationPools: BigInt!

  # Slashing aggregates
  "Total tokens slashed"
  tokensSlashed: BigInt!
  "Total tokens slashed from provisions"
  tokensSlashedFromProvisions: BigInt!
  "Total tokens slashed from delegation pools"
  tokensSlashedFromDelegationPools: BigInt!

  # Payment collection aggregates
  "Total tokens collected in the protocol"
  tokensCollected: BigInt!
  "Tokens burned as protocol tax"
  tokensDistributedAsProtocolTax: BigInt!
  "Tokens distributed to service providers"
  tokensDistributedToServiceProviders: BigInt!
  "Tokens distributed to delegation pools"
  tokensDistributedToDelegationPools: BigInt!
  "Tokens distributed to data services"
  tokensDistributedToDataServices: BigInt!

  # Payment escrow aggregates
  "Total tokens held in escrow"
  tokensEscrowed: BigInt!
  "Total tokens currently thawing in escrow"
  tokensThawingFromEscrow: BigInt!
}

type ServiceProvider @entity(immutable: false) {
  "Service provider address"
  id: Bytes!

  # Relationships
  "Provisions created by this service provider"
  provisions: [Provision!]! @derivedFrom(field: "serviceProvider")
  "Delegation pools for this service provider"
  delegationPools: [DelegationPool!]! @derivedFrom(field: "serviceProvider")
  "Provision thaw requests for this service provider"
  provisionThawRequests: [ProvisionThawRequest!]! @derivedFrom(field: "serviceProvider")
  "Operator authorizations for this service provider"
  operatorAuthorizations: [OperatorAuthorization!]! @derivedFrom(field: "serviceProvider")
  "Escrow accounts where this service provider is the receiver"
  escrowAccounts: [EscrowAccount!]! @derivedFrom(field: "serviceProvider")

  # Counts
  "Number of active provisions"
  countProvisions: Int!
  "Active escrow accounts"
  countEscrowAccounts: Int!
  "Provision slash events"
  countProvisionSlashEvents: Int!
  "Delegation pool slash events"
  countDelegationPoolSlashEvents: Int!

  # Stake
  "Tokens staked by the service provider"
  tokensStaked: BigInt!
  "Tokens provisioned to data services"
  tokensProvisioned: BigInt!
  "Tokens that are not locked in provisions"
  tokensIdle: BigInt!
  "Tokens currently thawing from provisions"
  tokensThawing: BigInt!

  # Delegation
  "Tokens delegated to this service provider"
  tokensDelegated: BigInt!
  "Tokens currently thawing from delegation pools"
  tokensDelegatedThawing: BigInt!

  # Payment collection
  "Total tokens collected for this service provider"
  tokensCollected: BigInt!
  "Tokens distributed to this service provider"
  tokensDistributedToServiceProvider: BigInt!
  "Tokens distributed as protocol tax from this service provider's collections"
  tokensDistributedAsProtocolTax: BigInt!
  "Tokens distributed to delegation pools from this service provider's collections"
  tokensDistributedToDelegationPools: BigInt!
  "Tokens distributed to data services from this service provider's collections"
  tokensDistributedToDataServices: BigInt!

  # Escrow
  "Total tokens in escrow for this service provider"
  tokensEscrowed: BigInt!

  # Slashing
  "Total tokens slashed"
  tokensSlashed: BigInt!
  "Tokens slashed from provisions"
  tokensSlashedFromProvisions: BigInt!
  "Tokens slashed from delegation pools"
  tokensSlashedFromDelegationPools: BigInt!

  # Metadata
  "Block number when entity was created"
  createdAtBlock: BigInt!
  "Timestamp when entity was created"
  createdAt: BigInt!
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}

type DataService @entity(immutable: false) {
  "Data service (verifier) contract address"
  id: Bytes!

  # Relationships
  "Provisions for this data service"
  provisions: [Provision!]! @derivedFrom(field: "dataService")
  "Delegation pools for this data service"
  delegationPools: [DelegationPool!]! @derivedFrom(field: "dataService")
  "Provision thaw requests for this data service"
  provisionThawRequests: [ProvisionThawRequest!]! @derivedFrom(field: "dataService")
  "Operator authorizations for this data service"
  operatorAuthorizations: [OperatorAuthorization!]! @derivedFrom(field: "dataService")

  # Counts
  "Active service providers with provisions to this data service"
  countServiceProviders: Int!
  "Active provisions"
  countProvisions: Int!
  "Active delegation pools"
  countDelegationPools: Int!
  "Provision slash events"
  countProvisionSlashEvents: Int!
  "Delegation pool slash events"
  countDelegationPoolSlashEvents: Int!

  # Tokens
  "Total tokens provisioned to this data service"
  tokensProvisioned: BigInt!
  "Total tokens delegated to service providers for this data service"
  tokensDelegated: BigInt!
  "Tokens currently thawing from provisions"
  tokensThawingFromProvisions: BigInt!
  "Tokens currently thawing from delegation pools"
  tokensThawingFromDelegationPools: BigInt!

  # Slashing
  "Total tokens slashed"
  tokensSlashed: BigInt!
  "Tokens slashed from provisions"
  tokensSlashedFromProvisions: BigInt!
  "Tokens slashed from delegation pools"
  tokensSlashedFromDelegationPools: BigInt!

  # Payment collection
  "Total tokens collected through this data service"
  tokensCollected: BigInt!
  "Tokens distributed to this data service (data service cut)"
  tokensDistributedToDataService: BigInt!
  "Tokens distributed as protocol tax from collections through this data service"
  tokensDistributedAsProtocolTax: BigInt!
  "Tokens distributed to delegation pools from collections through this data service"
  tokensDistributedToDelegationPools: BigInt!
  "Tokens distributed to service providers from collections through this data service"
  tokensDistributedToServiceProviders: BigInt!

  # Metadata
  "Block number when entity was created"
  createdAtBlock: BigInt!
  "Timestamp when entity was created"
  createdAt: BigInt!
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}

type DelegationPool @entity(immutable: false) {
  "Composite ID: serviceProvider-dataService"
  id: Bytes!

  # Relationships
  "Service provider that owns this pool"
  serviceProvider: ServiceProvider!
  "Data service (verifier)"
  dataService: DataService!

  # Pool state
  "Total tokens in the pool"
  tokens: BigInt!
  "Total shares in the pool"
  shares: BigInt!
  "Tokens currently thawing"
  tokensThawing: BigInt!
  "Total tokens distributed to this pool from payments"
  tokensDistributed: BigInt!
  "Total tokens slashed from this pool"
  tokensSlashed: BigInt!

  # Legacy delegation parameters (only set for legacy pools migrated from pre-Horizon)
  "[Legacy] Percentage of indexing rewards for the indexer, in PPM. Used to calculate delegation rewards from legacy allocations."
  legacyIndexingRewardCut: Int

  # Metadata
  "Block number when entity was created"
  createdAtBlock: BigInt!
  "Timestamp when entity was created"
  createdAt: BigInt!
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}

type Provision @entity(immutable: false) {
  "Composite ID: serviceProvider-dataService"
  id: Bytes!

  # Relationships
  "Service provider that created this provision"
  serviceProvider: ServiceProvider!
  "Data service (verifier)"
  dataService: DataService!
  "Thaw requests for this provision"
  thawRequests: [ProvisionThawRequest!]! @derivedFrom(field: "provision")
  "Fee cuts for delegators by payment type"
  feeCuts: [ProvisionFeeCut!]! @derivedFrom(field: "provision")

  # Tokens
  "Tokens currently provisioned"
  tokens: BigInt!
  "Tokens currently thawing"
  tokensThawing: BigInt!
  "Total tokens collected through this provision"
  tokensCollected: BigInt!
  "Total tokens slashed from this provision"
  tokensSlashed: BigInt!

  # Parameters
  "Maximum cut the verifier can take (PPM)"
  maxVerifierCut: BigInt!
  "Thawing period in seconds"
  thawingPeriod: BigInt!

  # Staged parameters (pending acceptance)
  "Staged max verifier cut"
  maxVerifierCutPending: BigInt!
  "Staged thawing period"
  thawingPeriodPending: BigInt!
  "Timestamp when parameters were last staged"
  lastParametersStagedAt: BigInt!

  # Metadata
  "Block number when entity was created"
  createdAtBlock: BigInt!
  "Timestamp when entity was created"
  createdAt: BigInt!
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}

type ProvisionFeeCut @entity(immutable: false) {
  "Composite ID: serviceProvider-dataService-paymentType"
  id: Bytes!

  # Relationships
  "Provision this fee cut belongs to"
  provision: Provision
  "Service provider"
  serviceProvider: ServiceProvider
  "Data service"
  dataService: DataService

  # State
  "Payment type (maps to PaymentTypes enum: 0 = QueryFee, 1 = IndexingFee, 2 = IndexingReward, ...)"
  paymentType: Int!
  "Fee cut percentage (PPM)"
  feeCut: BigInt!

  # Metadata
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}

type ProvisionThawRequest @entity(immutable: false) {
  "Thaw request ID (bytes32) emitted by ThawRequestCreated event"
  id: Bytes!

  # Relationships
  "Provision being thawed"
  provision: Provision!
  "Service provider"
  serviceProvider: ServiceProvider!
  "Data service (verifier)"
  dataService: DataService!

  # State
  "Shares being thawed"
  shares: BigInt!
  "Timestamp when thaw completes"
  thawingUntil: BigInt!
  "Thawing nonce at time of creation"
  thawingNonce: BigInt!
  "Tokens withdrawn (set on fulfillment, null while pending)"
  tokensWithdrawn: BigInt

  # Status
  "False if invalidated by slashing"
  valid: Boolean!
  "True when tokens have been withdrawn"
  fulfilled: Boolean!

  # Metadata
  "Block number when entity was created"
  createdAtBlock: BigInt!
  "Timestamp when entity was created"
  createdAt: BigInt!
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}

type Operator @entity(immutable: false) {
  "Operator address"
  id: Bytes!

  # Relationships
  "Authorizations granted to this operator"
  authorizations: [OperatorAuthorization!]! @derivedFrom(field: "operator")

  # Counts
  "Active authorizations (allowed=true)"
  countAuthorizations: Int!

  # Metadata
  "Block number when entity was created"
  createdAtBlock: BigInt!
  "Timestamp when entity was created"
  createdAt: BigInt!
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}

type OperatorAuthorization @entity(immutable: false) {
  "Composite ID: operator-serviceProvider-dataService"
  id: Bytes!

  # Relationships
  "Operator that is authorized"
  operator: Operator!
  "Service provider that granted the authorization"
  serviceProvider: ServiceProvider
  "Data service this authorization applies to"
  dataService: DataService

  # State
  "Whether the operator is currently authorized"
  allowed: Boolean!

  # Metadata
  "Block number when entity was created"
  createdAtBlock: BigInt!
  "Timestamp when entity was created"
  createdAt: BigInt!
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}

type Payer @entity(immutable: false) {
  "Payer address"
  id: Bytes!

  # Relationships
  "Escrow accounts funded by this payer"
  escrowAccounts: [EscrowAccount!]! @derivedFrom(field: "payer")

  # Counts
  "Active escrow accounts"
  countEscrowAccounts: Int!

  # Tokens
  "Total tokens in escrow"
  tokensEscrowed: BigInt!
  "Total tokens thawing"
  tokensThawing: BigInt!
  "Total tokens collected from escrow"
  tokensCollected: BigInt!

  # Metadata
  "Block number when entity was created"
  createdAtBlock: BigInt!
  "Timestamp when entity was created"
  createdAt: BigInt!
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}

type Collector @entity(immutable: false) {
  "Collector contract address"
  id: Bytes!

  # Relationships
  "Escrow accounts using this collector"
  escrowAccounts: [EscrowAccount!]! @derivedFrom(field: "collector")

  # Counts
  "Active escrow accounts"
  countEscrowAccounts: Int!

  # Tokens
  "Total tokens in escrow"
  tokensEscrowed: BigInt!
  "Total tokens thawing"
  tokensThawing: BigInt!
  "Total tokens collected"
  tokensCollected: BigInt!

  # Metadata
  "Block number when entity was created"
  createdAtBlock: BigInt!
  "Timestamp when entity was created"
  createdAt: BigInt!
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}

type EscrowAccount @entity(immutable: false) {
  "Concatenation of payer, collector, and service provider addresses"
  id: Bytes!

  # Relationships
  "Payer that deposited funds into the escrow account"
  payer: Payer!
  "Collector allowed to withdraw funds from the account"
  collector: Collector!
  "Service provider that can receive funds from the account"
  serviceProvider: ServiceProvider!

  # Tokens
  "Available tokens"
  tokens: BigInt!
  "Tokens currently thawing"
  tokensThawing: BigInt!
  "Timestamp when thawing completes (0 if not thawing)"
  thawEndTimestamp: BigInt!
  "Total tokens collected from this escrow account"
  tokensCollected: BigInt!

  # Metadata
  "Block number when entity was created"
  createdAtBlock: BigInt!
  "Timestamp when entity was created"
  createdAt: BigInt!
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}
