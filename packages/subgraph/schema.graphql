type GraphNetwork @entity(immutable: false) {
  "Singleton entity, always '1'"
  id: Bytes!

  # Counts
  "Active service providers"
  countServiceProviders: Int!
  "Active data services (verifiers)"
  countDataServices: Int!
  "Active provisions"
  countProvisions: Int!
  "Active delegation pools"
  countDelegationPools: Int!
  "Provision slash events"
  countProvisionSlashEvents: Int!
  "Delegation pool slash events"
  countDelegationPoolSlashEvents: Int!

  # Stake aggregates
  "Total tokens staked by service providers"
  tokensStaked: BigInt!
  "Total tokens provisioned to data services"
  tokensProvisioned: BigInt!
  "Total tokens delegated to service providers"
  tokensDelegated: BigInt!
  "Total tokens currently thawing from provisions"
  tokensThawingFromProvisions: BigInt!
  "Total tokens currently thawing from delegation pools"
  tokensThawingFromDelegationPools: BigInt!

  # Slashing aggregates
  "Total tokens slashed"
  tokensSlashed: BigInt!
  "Total tokens slashed from provisions"
  tokensSlashedFromProvisions: BigInt!
  "Total tokens slashed from delegation pools"
  tokensSlashedFromDelegationPools: BigInt!
}

type ServiceProvider @entity(immutable: false) {
  "Service provider address"
  id: Bytes!

  # Relationships
  "Provisions created by this service provider"
  provisions: [Provision!]! @derivedFrom(field: "serviceProvider")
  "Delegation pools for this service provider"
  delegationPools: [DelegationPool!]! @derivedFrom(field: "serviceProvider")
  "Provision thaw requests for this service provider"
  provisionThawRequests: [ProvisionThawRequest!]! @derivedFrom(field: "serviceProvider")

  # Counts
  "Number of active provisions"
  countProvisions: Int!
  "Provision slash events"
  countProvisionSlashEvents: Int!
  "Delegation pool slash events"
  countDelegationPoolSlashEvents: Int!

  # Stake
  "Tokens staked by the service provider"
  tokensStaked: BigInt!
  "Tokens provisioned to data services"
  tokensProvisioned: BigInt!
  "Tokens that are not locked in provisions"
  tokensIdle: BigInt!
  "Tokens currently thawing from provisions"
  tokensThawing: BigInt!

  # Delegation
  "Tokens delegated to this service provider"
  tokensDelegated: BigInt!
  "Tokens currently thawing from delegation pools"
  tokensDelegatedThawing: BigInt!

  # Slashing
  "Total tokens slashed"
  tokensSlashed: BigInt!
  "Tokens slashed from provisions"
  tokensSlashedFromProvisions: BigInt!
  "Tokens slashed from delegation pools"
  tokensSlashedFromDelegationPools: BigInt!

  # Metadata
  "Block number when entity was created"
  createdAtBlock: BigInt!
  "Timestamp when entity was created"
  createdAt: BigInt!
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}

type DataService @entity(immutable: false) {
  "Data service (verifier) contract address"
  id: Bytes!

  # Relationships
  "Provisions for this data service"
  provisions: [Provision!]! @derivedFrom(field: "dataService")
  "Delegation pools for this data service"
  delegationPools: [DelegationPool!]! @derivedFrom(field: "dataService")
  "Provision thaw requests for this data service"
  provisionThawRequests: [ProvisionThawRequest!]! @derivedFrom(field: "dataService")

  # Counts
  "Active service providers with provisions to this data service"
  countServiceProviders: Int!
  "Active provisions"
  countProvisions: Int!
  "Active delegation pools"
  countDelegationPools: Int!
  "Provision slash events"
  countProvisionSlashEvents: Int!
  "Delegation pool slash events"
  countDelegationPoolSlashEvents: Int!

  # Tokens
  "Total tokens provisioned to this data service"
  tokensProvisioned: BigInt!
  "Total tokens delegated to service providers for this data service"
  tokensDelegated: BigInt!
  "Tokens currently thawing from provisions"
  tokensThawingFromProvisions: BigInt!
  "Tokens currently thawing from delegation pools"
  tokensThawingFromDelegationPools: BigInt!

  # Slashing
  "Total tokens slashed"
  tokensSlashed: BigInt!
  "Tokens slashed from provisions"
  tokensSlashedFromProvisions: BigInt!
  "Tokens slashed from delegation pools"
  tokensSlashedFromDelegationPools: BigInt!

  # Metadata
  "Block number when entity was created"
  createdAtBlock: BigInt!
  "Timestamp when entity was created"
  createdAt: BigInt!
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}

type DelegationPool @entity(immutable: false) {
  "Composite ID: serviceProvider-dataService"
  id: Bytes!

  # Relationships
  "Service provider that owns this pool"
  serviceProvider: ServiceProvider!
  "Data service (verifier)"
  dataService: DataService!

  # Pool state
  "Total tokens in the pool"
  tokens: BigInt!
  "Total shares in the pool"
  shares: BigInt!
  "Tokens currently thawing"
  tokensThawing: BigInt!

  # Legacy delegation parameters (only set for legacy pools migrated from pre-Horizon)
  "[Legacy] Percentage of indexing rewards for the indexer, in PPM. Used to calculate delegation rewards from legacy allocations."
  legacyIndexingRewardCut: Int

  # Metadata
  "Block number when entity was created"
  createdAtBlock: BigInt!
  "Timestamp when entity was created"
  createdAt: BigInt!
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}

type Provision @entity(immutable: false) {
  "Composite ID: serviceProvider-dataService"
  id: Bytes!

  # Relationships
  "Service provider that created this provision"
  serviceProvider: ServiceProvider!
  "Data service (verifier)"
  dataService: DataService!
  "Thaw requests for this provision"
  thawRequests: [ProvisionThawRequest!]! @derivedFrom(field: "provision")

  # Tokens
  "Tokens currently provisioned"
  tokens: BigInt!
  "Tokens currently thawing"
  tokensThawing: BigInt!

  # Parameters
  "Maximum cut the verifier can take (PPM)"
  maxVerifierCut: BigInt!
  "Thawing period in seconds"
  thawingPeriod: BigInt!

  # Staged parameters (pending acceptance)
  "Staged max verifier cut"
  maxVerifierCutPending: BigInt!
  "Staged thawing period"
  thawingPeriodPending: BigInt!
  "Timestamp when parameters were last staged"
  lastParametersStagedAt: BigInt!

  # Metadata
  "Block number when entity was created"
  createdAtBlock: BigInt!
  "Timestamp when entity was created"
  createdAt: BigInt!
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}

type ProvisionThawRequest @entity(immutable: false) {
  "Thaw request ID (bytes32) emitted by ThawRequestCreated event"
  id: Bytes!

  # Relationships
  "Provision being thawed"
  provision: Provision!
  "Service provider"
  serviceProvider: ServiceProvider!
  "Data service (verifier)"
  dataService: DataService!

  # State
  "Shares being thawed"
  shares: BigInt!
  "Timestamp when thaw completes"
  thawingUntil: BigInt!
  "Thawing nonce at time of creation"
  thawingNonce: BigInt!
  "Tokens withdrawn (set on fulfillment, null while pending)"
  tokensWithdrawn: BigInt

  # Status
  "False if invalidated by slashing"
  valid: Boolean!
  "True when tokens have been withdrawn"
  fulfilled: Boolean!

  # Metadata
  "Block number when entity was created"
  createdAtBlock: BigInt!
  "Timestamp when entity was created"
  createdAt: BigInt!
  "Block number when entity was last updated"
  updatedAtBlock: BigInt!
  "Timestamp when entity was last updated"
  updatedAt: BigInt!
}
