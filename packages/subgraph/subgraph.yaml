specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: HorizonStaking
    network: arbitrum-one
    source:
      address: "0x00669A4CF01450B64E8A2A20E9b1FCB71E61eF03"
      abi: HorizonStaking
      startBlock: 408825706
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - GraphNetwork
        - ServiceProvider
        - DataService
        - Provision
        - DelegationPool
        - ProvisionThawRequest
        - ProvisionFeeCut
        - Operator
        - OperatorAuthorization
      abis:
        - name: HorizonStaking
          file: ./abis/HorizonStaking.json
      blockHandlers:
        - handler: handleHorizonGenesisBlock
          filter:
            kind: once
      eventHandlers:
        - event: HorizonStakeDeposited(indexed address,uint256)
          handler: handleHorizonStakeDeposited
        - event: HorizonStakeWithdrawn(indexed address,uint256)
          handler: handleHorizonStakeWithdrawn
        - event: ProvisionCreated(indexed address,indexed address,uint256,uint32,uint64)
          handler: handleProvisionCreated
        - event: ProvisionIncreased(indexed address,indexed address,uint256)
          handler: handleProvisionIncreased
        - event: ProvisionThawed(indexed address,indexed address,uint256)
          handler: handleProvisionThawed
        - event: ProvisionSlashed(indexed address,indexed address,uint256)
          handler: handleProvisionSlashed
        - event: ProvisionParametersStaged(indexed address,indexed address,uint32,uint64)
          handler: handleProvisionParametersStaged
        - event: ProvisionParametersSet(indexed address,indexed address,uint32,uint64)
          handler: handleProvisionParametersSet
        - event: TokensDeprovisioned(indexed address,indexed address,uint256)
          handler: handleTokensDeprovisioned
        # Delegation events
        - event: TokensToDelegationPoolAdded(indexed address,indexed address,uint256)
          handler: handleTokensToDelegationPoolAdded
        - event: TokensDelegated(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTokensDelegated
        - event: TokensUndelegated(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTokensUndelegated
        - event: DelegatedTokensWithdrawn(indexed address,indexed address,indexed address,uint256)
          handler: handleDelegatedTokensWithdrawn
        - event: DelegationSlashed(indexed address,indexed address,uint256)
          handler: handleDelegationSlashed
        - event: DelegationFeeCutSet(indexed address,indexed address,indexed uint8,uint256)
          handler: handleDelegationFeeCutSet
        # Operator events
        - event: OperatorSet(indexed address,indexed address,indexed address,bool)
          handler: handleOperatorSet
        # Thaw request events
        - event: ThawRequestCreated(indexed uint8,indexed address,indexed address,address,uint256,uint64,bytes32,uint256)
          handler: handleThawRequestCreated
        - event: ThawRequestFulfilled(indexed uint8,indexed bytes32,uint256,uint256,uint64,bool)
          handler: handleThawRequestFulfilled
        # Legacy delegation reward events (HorizonStakingExtension)
        - event: RebateCollected(address,indexed address,indexed bytes32,indexed address,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleRebateCollected
        - event: AllocationClosed(indexed address,indexed bytes32,uint256,uint256,indexed address,address,bytes32,bool)
          handler: handleAllocationClosed
          receipt: true
      file: ./src/mapping.ts
  - kind: ethereum
    name: GraphPayments
    network: arbitrum-one
    source:
      address: "0x7Aae8ae011927BC36Cb4d0d3e81f2E6E30daE06D"
      abi: GraphPayments
      startBlock: 397491099
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - GraphNetwork
        - ServiceProvider
        - DataService
        - Provision
        - DelegationPool
      abis:
        - name: GraphPayments
          file: ./abis/GraphPayments.json
      eventHandlers:
        - event: GraphPaymentCollected(indexed uint8,indexed address,address,indexed address,uint256,uint256,uint256,uint256,uint256,address)
          handler: handleGraphPaymentCollected
      file: ./src/mapping.ts
  - kind: ethereum
    name: PaymentsEscrow
    network: arbitrum-one
    source:
      address: "0xf6Fcc27aAf1fcD8B254498c9794451d82afC673E"
      abi: PaymentsEscrow
      startBlock: 397491106
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - GraphNetwork
        - ServiceProvider
        - Payer
        - Collector
        - EscrowAccount
      abis:
        - name: PaymentsEscrow
          file: ./abis/PaymentsEscrow.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,indexed address,uint256)
          handler: handleDeposit
        - event: Thaw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleThaw
        - event: CancelThaw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleCancelThaw
        - event: Withdraw(indexed address,indexed address,indexed address,uint256)
          handler: handleWithdraw
        - event: EscrowCollected(indexed uint8,indexed address,indexed address,address,uint256,address)
          handler: handleEscrowCollected
      file: ./src/mapping.ts
